# App product name is "BotaniSense for Immich"; the ML engine inside is
# BioCLIP-2. The two names are distinct — see DEVELOPMENT.md for the
# dual-naming convention.
[project]
name = "botanisense-for-immich"
version = "0.1.0"
description = "Browse an Immich library by plant species, with BioCLIP-2 zero-shot and optional KNN reclassification."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "pybioclip>=0.2",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.7.2",
    "ultralytics>=8.4.113",
    # YOLO-World bakes its open-vocab text embeddings through OpenAI's
    # CLIP (import name `clip`); ultralytics only auto-installs it on
    # first set_classes() via `pip install git+...ultralytics/CLIP`,
    # which fails in the unprivileged container. Pin the source directly
    # — a tarball so slim images don't need git. (The PyPI project named
    # `clip` is an unrelated squat; this MUST stay a direct URL.)
    "clip @ https://github.com/ultralytics/CLIP/archive/refs/heads/master.tar.gz",
    "faiss-cpu>=1.8",
    "duckdb>=1.0",
    "pyarrow>=25.0.0",
    # ENGINE=mobile-* (mobile_engine.py) + YOLO_BACKEND=gemini1
    # (yolo_gemini1.py). Both import it lazily — a production container
    # with neither env var set never loads it, but it must ship so the
    # A/B compose file (compose.s0.yml) works from the same image.
    "onnxruntime>=1.20",
    # tomllib is stdlib in 3.11+. The 3.10 fallback is gated by the
    # python_version marker below — only installed when running 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
