# App product name is "BotaniSense for Immich"; the ML engine inside is
# BioCLIP-2. The two names are distinct — see DEVELOPMENT.md for the
# dual-naming convention.
[project]
name = "botanisense-for-immich"
version = "0.1.0"
description = "Browse an Immich library by plant species, with BioCLIP-2 zero-shot and optional KNN reclassification."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "Pillow>=10.0",
    "pybioclip>=0.2",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.7.2",
    "faiss-cpu>=1.8",
    "duckdb>=1.0",
    "pyarrow>=25.0.0",
    # Detection (yolo_rtmdet.py, the default; yolo_obj6.py) and
    # ENGINE=mobile-* (mobile_engine.py) all run ONNX graphs. No
    # Ultralytics here on purpose — it is AGPL-3.0; see README "License".
    "onnxruntime>=1.20",
    # Letterbox/resize for the detectors + the YuNet face rescue
    # (face.py). Headless: the slim image has no GUI libs.
    "opencv-python-headless>=4.8",
    # tomllib is stdlib in 3.11+. The 3.10 fallback is gated by the
    # python_version marker below — only installed when running 3.10.
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]
