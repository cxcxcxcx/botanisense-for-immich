name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync
      - name: Run pytest
        run: uv run pytest tests/ -x
        env:
          # Tests don't talk to a real Immich instance, but a few
          # imports touch the .env / config paths. Provide a fake key
          # so app.py / run.py can be imported without SystemExit.
          IMMICH_API_KEY: test-fixture-do-not-use
          IMMICH_BASE_URL: http://localhost:2283

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build