# BotaniSense for Immich — user config.
#
# Copy this file to `config.toml` (which is gitignored) and edit the
# values to match your setup.
#
# Path precedence:
#
#   1. $BOTANISENSE_CONFIG env var (full path; file must exist)
#   2. ./config.toml  (working directory; optional)
#
# When a key is not set in this file, the app falls back to the matching
# environment variable (e.g. `IMMICH_BASE_URL`). When neither is set, the
# app refuses to start for required keys and uses an empty/disabling
# value for optional ones. See README.md for the full list of env vars.

[immich]
# Required. No default — the app refuses to start without it.
base_url = "http://192.168.1.10:2283"

# `api_key` is intentionally NOT in this file. Read IMMICH_API_KEY from
# your shell environment (e.g. via .env with python-dotenv, a systemd
# EnvironmentFile=, or docker-compose secrets). Keeping secrets out of
# a tracked-file format is intentional.

[knn]
# Optional. Directory holding a FAISS index over BioCLIP-2 embeddings.
# Easiest: download the official imageomics index (~20 GB) with
#   uv run scripts/download_knn_index.py --out knn-index
# which creates knn-index/faiss/index.index + knn-index/duckdb/metadata.duckdb.
# Or build your own (`python -m knn --help`) producing
#   tol200m_bioclip2.faiss + labels.parquet + INDEX_VERSION.txt.
# Use an ABSOLUTE path (relative paths resolve against the server's
# working directory — inside Docker that's /app). Leave empty to
# disable KNN reclassification entirely.
inventory_dir = ""

[cors]
# Optional. Origins allowed to call /api/*. Default = ANY origin (`*`),
# which works out of the box for both the prod build (same-origin via
# uvicorn) and dev (Vite on :5173 → uvicorn on :8765 cross-origin).
# Narrow this list when exposing the app over a public reverse proxy:
#
# Example for prod behind nginx:
#   origins = ["https://botanisense.example.com"]
#
# `allow_credentials` stays False, so `*` is safe with browsers
# (cookies aren't used; auth is the IMMICH_API_KEY sent per request).
#
# Set to an empty list `[]` to enforce same-origin only (stricter;
# blocks the Vite dev server).
# origins = []
origins = ["*"]